name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests on Firebase emulators
        env:
          FIREBASE_PROJECT_ID: clinic-ai-ci
          SENTRY_TEST_ENABLED: "false"
        run: >
          pnpm dlx firebase-tools@latest emulators:exec
          --project clinic-ai-ci
          --only firestore,auth
          "pnpm --filter api seed && pnpm test"
